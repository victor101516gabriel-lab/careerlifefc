<script>
const KEY='gaert_modo_carreiras_v2', OLD='careerLife_complete_v1';
const base={id:Date.now(),created:true,player:{name:'V.GAERT',nickname:'Gaert',shirt:14,age:16,birth:'2010-02-10',nation:'Brasil',city:'Porto Alegre',position:'Meia',secondary:'Ponta Direita',foot:'Direito',height:178,weight:68,club:'Vasco',level:'Base',ovr:67,potential:89,value:350000,salary:1800,contract:2,popularity:35,followers:1240,pro:78,amb:86,lead:58,hum:72,temp:64,loyal:80,pace:78,dribble:81,pass:76,finish:70,strength:61,stamina:74,vision:79,defense:35,control:83},date:{d:15,m:9,y:2026},stats:{apps:0,goals:0,assists:0,minutes:0,yellow:0,red:0},season:{apps:0,goals:0,assists:0},injury:null,posts:[{text:'Começando uma nova fase. Trabalho, foco e gratidão. ⚽',likes:186,comments:12,date:'15/09/2026'}],news:['V.GAERT é apontado como uma das promessas para observar na base.','Comissão técnica destaca evolução do meia nos treinamentos.','Mercado começa a monitorar jovens talentos da temporada.'],offers:[],trophies:[],finance:[],history:[{year:2026,age:16,club:'Vasco',apps:0,goals:0,assists:0,ovr:67}],national:{apps:0,goals:0,called:false}};
let S=load(),page='home';
function clone(x){return JSON.parse(JSON.stringify(x))}
function repairState(v){
  let n=clone(base);
  if(v&&typeof v==='object'){
    Object.assign(n,v);
    n.player=Object.assign(clone(base.player),v.player||{});
    n.date=Object.assign(clone(base.date),v.date||{});
    n.stats=Object.assign(clone(base.stats),v.stats||{});
    n.season=Object.assign(clone(base.season),v.season||{});
    n.national=Object.assign(clone(base.national),v.national||{});
    for(const k of ['finance','posts','news','history','trophies']) n[k]=Array.isArray(v[k])?v[k]:[];
  }
  n.player.ovr=Math.max(1,Math.min(99,Number(n.player.ovr)||67));
  n.player.potential=Math.max(n.player.ovr,Math.min(99,Number(n.player.potential)||89));
  n.player.age=Math.max(12,Math.min(60,Number(n.player.age)||16));
  n.player.energy=Math.max(0,Math.min(100,Number(n.player.energy??82)));
  n.player.fatigue=Math.max(0,Math.min(100,Number(n.player.fatigue??18)));
  n.player.morale=Math.max(0,Math.min(100,Number(n.player.morale??78)));
  n.choices=Array.isArray(v?.choices)?v.choices:[];
  n.player.professionalism=Math.max(0,Math.min(100,Number(n.player.professionalism??70)));
  n.player.ambition=Math.max(0,Math.min(100,Number(n.player.ambition??70)));
  n.player.leadership=Math.max(0,Math.min(100,Number(n.player.leadership??60)));
  n.player.loyalty=Math.max(0,Math.min(100,Number(n.player.loyalty??70)));
  if(v?.match&&typeof v.match==='object'){n.match=v.match}else n.match=null;
  return n;
}
function load(){
  try{
    let v=JSON.parse(localStorage.getItem(KEY)); if(v)return repairState(v);
    let old=JSON.parse(localStorage.getItem(OLD)); if(old)return repairState(old);
  }catch(e){}
  return repairState(base);
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){return false}
}
function fmt(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n)}
function dateStr(){return `${String(S.date.d).padStart(2,'0')}/${String(S.date.m).padStart(2,'0')}/${S.date.y}`}
function note(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1800)}
const titles={home:'Início',create:'Criar personagem',careers:'Minhas carreiras',training:'Treinos',choices:'Escolhas',ranking:'Ranking',news:'Notícias',instagram:'Instagram',finance:'Finanças',trophies:'Títulos',national:'Seleção',settings:'Configurações'};
function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>nav(x.dataset.page));
function statBox(label,value,pct){return `<div class="stat"><small>${label}</small><b>${value}</b>${pct!=null?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}</div>`}
function feature(icon,title,text,action){return `<div class="card feature"><div class="feature-art">${icon}</div><h3>${title}</h3><p>${text}</p><button class="mini-btn" onclick="${action}">Abrir →</button></div>`}

function matchCenter(){
  const m=S.match,p=S.player;
  const rating=Number(m.rating||6).toFixed(1);

  const choices=m.pendingChoice?`<div class="match-choice"><h3>${m.pendingChoice.title}</h3><p class="muted">${m.pendingChoice.text}</p><div class="choice-grid">${m.pendingChoice.options.map((o,i)=>`<button class="btn ${i===0?'primary':''}" onclick="matchChoice(${i})">${o}</button>`).join('')}</div></div>`:'';
  return `<div class="content-title"><h2>Partida ao vivo</h2><small><span class="live-dot"></span>${m.minute<90?'AO VIVO':'ACRÉSCIMOS'}</small></div>
  <div class="grid g2">
    <div class="match-hero">
      <div class="match-top"><div><div class="match-league">Campeonato Brasileiro · ${m.stadium}</div><b>${m.round}ª rodada</b></div><div class="match-clock">${String(m.minute).padStart(2,'0')}'</div></div>
      <div class="match-score"><div><div class="team-badge">⚫</div><div class="team-name">${escapeHtml(m.home)}</div></div><div><div class="score">${m.homeGoals} : ${m.awayGoals}</div><div class="match-status">${m.minute>=90?'APITO FINAL':'Partida em andamento'}</div></div><div><div class="team-badge">🔴</div><div class="team-name">${m.away}</div></div></div>
      <div class="tactics">${[['attack','⚔️ Ataque'],['balanced','⚖️ Equilíbrio'],['safe','🛡️ Segurança'],['risk','🔥 Risco']].map(([k,l])=>`<button class="tactic ${m.tactic===k?'active':''}" onclick="matchTactic('${k}')">${l}</button>`).join('')}</div>
      <div class="match-controls"><button class="btn" onclick="matchNext(1)">+1 min</button><button class="btn" onclick="matchNext(5)">+5 min</button><button class="btn primary" onclick="matchNext(10)">+10 min</button></div>
      ${choices}

    <div class="grid">
      <div class="card player-match-card"><div class="eyebrow">Seu desempenho</div><div><span class="match-rating ${rclass}">${rating}</span><span class="muted"> / 10.0</span></div><div class="row"><span>Energia</span><b>${Math.round(m.energy)}%</b></div><div class="progress"><i style="width:${m.energy}%"></i></div><div class="row"><span>Posição</span><b>${p.position}</b></div><div class="row"><span>Ações</span><b>${m.playerActions}</b></div></div>
      <div class="card"><div class="eyebrow">Estatísticas</div><div class="statline"><span>Finalizações</span><b>${m.stats.shots}</b></div><div class="statline"><span>Dribles</span><b>${m.stats.dribbles}</b></div><div class="statline"><span>Passes certos</span><b>${m.stats.passes}</b></div><div class="statline"><span>Assistências</span><b>${m.stats.assists}</b></div><div class="statline"><span>Gols</span><b>${m.stats.goals}</b></div></div>
      <div class="card"><div class="eyebrow">Linha do tempo</div><div class="event-feed">${m.events.length?m.events.slice().reverse().map(e=>`<div class="match-event"><span class="min">${e.minute}'</span><span class="evicon">${e.icon}</span><div>${escapeHtml(e.text)}${e.detail?`<small>${escapeHtml(e.detail)}</small>`:''}</div></div>`).join(''):'<div class="empty">O árbitro ainda não apitou. A partida vai começar.</div>'}</div></div>
    </div>
  </div>`;
}
function postMatch(){
  const m=S.match,p=S.player;
  const result=m.homeGoals>m.awayGoals?'VITÓRIA':m.homeGoals<m.awayGoals?'DERROTA':'EMPATE';
  const rating=Number(m.rating||6).toFixed(1);
  return `<div class="content-title"><h2>Fim de jogo</h2><small>${m.home} ${m.homeGoals} × ${m.awayGoals} ${m.away}</small></div>
  <div class="grid g2"><div class="match-hero post-match"><div class="match-league">APITO FINAL</div><div class="score" style="text-align:center">${m.homeGoals} : ${m.awayGoals}</div><h2 style="text-align:center;margin:0">${result}</h2><div class="match-status">Nota do ${escapeHtml(p.name)}: <b class="${rating>=7.5?'green':rating>=6?'gold':'red'}">${rating}</b></div><button class="btn primary" onclick="closeMatchV6()">Voltar para partidas</button></div>
  <div class="card"><div class="eyebrow">Seu jogo</div><div class="statline"><span>Nota</span><b>${rating}</b></div><div class="statline"><span>Gols</span><b>${m.stats.goals}</b></div><div class="statline"><span>Assistências</span><b>${m.stats.assists}</b></div><div class="statline"><span>Finalizações</span><b>${m.stats.shots}</b></div><div class="statline"><span>Dribles</span><b>${m.stats.dribbles}</b></div><div class="statline"><span>Passes certos</span><b>${m.stats.passes}</b></div><div class="statline"><span>Minutos</span><b>${m.minute}</b></div><p class="muted">A atuação foi registrada no histórico da carreira, nas estatísticas e nas notícias.</p></div></div>`;
}
function startMatchV6(){
  if(S.match?.status==='live'){nav('matches');return}
  const p=S.player;
  if(p.injury){note('Você está lesionado e não pode jogar.');return}
  const energy=Math.max(15,Number(p.energy??82));
  S.match={status:'live',minute:0,home:p.club||'Seu clube',away:'Flamengo',homeGoals:0,awayGoals:0,stadium:'São Januário',round:(S.season.apps||0)+1,tactic:'balanced',rating:6.0,energy,playerActions:0,pendingChoice:null,events:[],stats:{shots:0,dribbles:0,passes:0,assists:0,goals:0},yellow:false,red:false};
  matchAddEvent(0,'🟢','Bola rolando.',`${p.name} começa a partida ${p.ovr>=72?'como titular':'no banco'}.`);
  save();render();note('⚽ Partida iniciada!');
}
function matchAddEvent(minute,icon,text,detail=''){S.match.events.push({minute,icon,text,detail})}
function matchTactic(t){if(!S.match||S.match.status!=='live')return;S.match.tactic=t;S.match.rating=Math.max(4,Math.min(10,S.match.rating+(t==='attack'?.05:t==='safe'?.03:t==='risk'?-.02:.02)));save();render();note('Tática alterada.')}
function matchChoice(i){
  const m=S.match;if(!m?.pendingChoice)return;
  const effects=m.pendingChoice.effects[i];m.pendingChoice=null;m.playerActions++;
  m.rating=Math.max(4,Math.min(10,m.rating+effects.rating));m.energy=Math.max(0,m.energy+effects.energy);
  if(effects.shot){m.stats.shots++;if(Math.random()<effects.goalChance){m.stats.goals++;m.homeGoals++;m.rating=Math.min(10,m.rating+.8);matchAddEvent(m.minute,'⚽',`${S.player.name} MARCA!`,effects.text);}}
  if(effects.dribble)m.stats.dribbles++;
  if(effects.pass)m.stats.passes++;
  if(effects.assist){m.stats.assists++;m.rating=Math.min(10,m.rating+.7);matchAddEvent(m.minute,'🅰️',`${S.player.name} deu a assistência!`,effects.text);}
  matchAddEvent(m.minute,'🎮',effects.label,effects.text);
  save();render();
}
function matchGenerateChoice(){
  const p=S.player,m=S.match;if(m.pendingChoice||Math.random()>.13)return;
  const chance=Math.random();
  if(chance<.34)m.pendingChoice={title:`${m.minute}' — Você recebe entre as linhas`,text:'Há espaço para decidir a próxima ação.',options:['Arriscar o passe vertical','Partir para o drible','Manter a posse'],effects:[{label:'Passe vertical tentado',rating:.35,energy:-2,pass:true,assist:Math.random()<.18,text:'A bola encontrou o atacante em boa condição.'},{label:'Drible ofensivo',rating:.25,energy:-4,dribble:true,shot:Math.random()<.25,goalChance:.14,text:'Você ganhou terreno e criou perigo.'},{label:'Posse segura',rating:.12,energy:-1,pass:true,text:'Você controlou o ritmo e manteve a equipe organizada.'}]};
  else if(chance<.67)m.pendingChoice={title:`${m.minute}' — O gol está no radar`,text:'Você recebeu a bola próximo da área.',options:['Finalizar de primeira','Cortar para dentro','Recuar e construir'],effects:[{label:'Finalização de primeira',rating:.2,energy:-5,shot:true,goalChance:Math.min(.48,(p.finish||70)/170),text:'Chute perigoso! O goleiro precisou trabalhar.'},{label:'Cortar para dentro',rating:.28,energy:-4,dribble:true,shot:true,goalChance:Math.min(.36,(p.finish||70)/210),text:'Você passou pelo marcador e bateu para o gol.'},{label:'Construir a jogada',rating:.18,energy:-1,pass:true,assist:Math.random()<.12,text:'Você escolheu a decisão mais segura.'}]};
  else m.pendingChoice={title:`${m.minute}' — Pressão sem a bola`,text:'O adversário iniciou um contra-ataque pelo seu setor.',options:['Pressionar imediatamente','Fechar a linha de passe','Recompor sem se expor'],effects:[{label:'Pressão intensa',rating:.3,energy:-6,dribble:false,text:'Você pressionou e recuperou terreno.'},{label:'Fechar passe',rating:.2,energy:-3,text:'Você cortou uma opção importante.'},{label:'Recomposição',rating:.12,energy:-1,text:'A equipe se reorganizou defensivamente.'}]};
}
function matchMinute(){
  const m=S.match,p=S.player;
  if(m.minute>=90)return;
  m.minute++;
  const tempo=m.minute;
  // desgaste realista
  const tacticCost={attack:1.15,balanced:0.85,safe:0.65,risk:1.35}[m.tactic]||.85;
  m.energy=Math.max(0,m.energy-(0.42+tacticCost*.18));
  // evento geral a cada minuto com probabilidades baixas, aumentando com o tempo
  const intensity=(Number(p.ovr)||67)/100;
  const roll=Math.random();
  if(roll<0.018){m.awayGoals++;matchAddEvent(tempo,'⚽',`Flamengo marca.`,`Contra-ataque rápido e finalização no canto.`);m.rating=Math.max(4,m.rating-.18)}
  else if(roll<0.033){m.homeGoals++;matchAddEvent(tempo,'⚽',`${p.club} marca!`,`A equipe aproveitou uma boa sequência ofensiva.`);m.rating=Math.min(10,m.rating+.15)}
  else if(roll<0.055){matchAddEvent(tempo,'🥅','Grande defesa do goleiro.','A partida continua sem alteração no placar.')}
  else if(roll<0.075){matchAddEvent(tempo,'💥','Finalização perigosa.','A bola passou muito perto da trave.');}
  else if(roll<0.09){matchAddEvent(tempo,'🚩','Escanteio.','A defesa afastou o cruzamento.')}
  else if(roll<0.102){matchAddEvent(tempo,'🟨','Cartão amarelo.','O árbitro advertiu um jogador após uma entrada forte.');if(Math.random()<.22){m.yellow=true;S.stats.yellow++;}}
  else if(roll<0.108){matchAddEvent(tempo,'🔄','Substituição.','O treinador mexe no time para mudar o ritmo.');m.energy=Math.min(100,m.energy+2)}
  else if(roll<0.114){matchAddEvent(tempo,'🩹','Atendimento médico.','Um jogador sentiu desconforto e recebeu atendimento.');}
  else if(roll<0.16){matchAddEvent(tempo,'⚡','Transição rápida.','As duas equipes aceleram a partida.');}
  // contribuição silenciosa do jogador
  if(Math.random() < (.10+intensity*.06))m.stats.passes++;
  if(Math.random() < ((p.dribble||70)/100)*.045)m.stats.dribbles++;
  if(Math.random() < ((p.finish||70)/100)*.025)m.stats.shots++;
  // escolhas durante o jogo
  matchGenerateChoice();
  if(m.energy<12 && Math.random()<.18){matchAddEvent(tempo,'😮‍💨',`${p.name} sente o desgaste.`,`A intensidade caiu; pense em controlar o ritmo.`);m.rating=Math.max(4,m.rating-.12)}
  if(m.minute===45){matchAddEvent(45,'⏸️','Intervalo.','O treinador passa instruções para o segundo tempo.');}
  if(m.minute===90){finishMatchV6();return;}
}
function matchNext(mins){
  const m=S.match;if(!m||m.status!=='live')return;
  if(m.pendingChoice){note('Tome a decisão antes de avançar.');return}
  mins=Math.max(1,Math.min(10,Number(mins)||1));
  for(let i=0;i<mins&&m.status==='live';i++)matchMinute();
  if(m.status==='live'){save();render();}
}
function finishMatchV6(){
  const m=S.match,p=S.player;
  m.status='finished';m.pendingChoice=null;
  // pequeno ajuste de nota pelo resultado e energia
  if(m.homeGoals>m.awayGoals)m.rating+=.25;else if(m.homeGoals<m.awayGoals)m.rating-=.18;
  m.rating=Math.max(4,Math.min(10,m.rating));
  S.stats.apps++;S.season.apps++;S.stats.minutes+=m.minute;
  S.stats.goals+=m.stats.goals;S.season.goals+=m.stats.goals;S.stats.assists+=m.stats.assists;S.season.assists+=m.stats.assists;
  p.energy=Math.max(0,Math.min(100,m.energy));p.fatigue=Math.min(100,(p.fatigue??18)+Math.round((82-m.energy)*.25));

function train(stat,label){
  const p=S.player;
  p.energy=Math.max(0,Number(p.energy??82));
  p.fatigue=Math.max(0,Number(p.fatigue??18));
  p.morale=Math.max(0,Number(p.morale??78));
  if(p.injury){note('Você está lesionado.');return}
  if(p.energy<10){note('Energia insuficiente. Descanse.');return}
  const gain=1+Math.floor(Math.random()*3);
  p[stat]=Math.min(99,(Number(p[stat])||60)+gain);
  if(p.ovr<p.potential && Math.random()<.65)p.ovr=Math.min(p.potential,p.ovr+1);
  p.energy=Math.max(0,p.energy-(stat==='strength'?18:14));
  p.fatigue=Math.min(100,p.fatigue+(stat==='strength'?16:12));
  p.morale=Math.min(100,p.morale+2);
  S.news.unshift(`${p.name} treinou ${label.toLowerCase()} e evoluiu ${gain} ponto(s).`);
  S.finance.push({date:dateStr(),type:`Treino — ${label}`,v:0});
  save();render();note(`🏋️ ${label}: +${gain} atributo`);
}
function fullTraining(){
  const p=S.player;
  if(p.injury){note('Você está lesionado.');return}
  if((p.energy??82)<20){note('Energia insuficiente.');return}
  ['pace','dribble','pass','finish','vision'].forEach(k=>{p[k]=Math.min(99,(Number(p[k])||60)+(Math.random()<.55?1:0))});
  if(p.ovr<p.potential)p.ovr++;
  p.energy=Math.max(0,(p.energy??82)-20);
  p.fatigue=Math.min(100,(p.fatigue??18)+20);
  p.morale=Math.min(100,(p.morale??78)+4);
  S.news.unshift(`${p.name} concluiu uma sessão completa no centro de treinamento.`);
  save();render();note('🔥 Treino completo concluído!');
}
function restDay(){
  const p=S.player;
  p.energy=Math.min(100,(p.energy??82)+28);
  p.fatigue=Math.max(0,(p.fatigue??18)-25);
  p.morale=Math.min(100,(p.morale??78)+3);
  if(p.injury && Math.random()<.35)p.injury=null;
  advanceDay();
  note('😴 Recuperação concluída.');
}
function play(sim){
  if(window.__matchBusy)return;
  window.__matchBusy=true;
  try{
    if(S.player.injury){note('Você está lesionado.');return}
    let p=S.player, rating=p.ovr/10+(Math.random()*3-1);
    let g=Math.random()<(Number(p.finish||70)/100*.35);
    let a=Math.random()<(Number(p.pass||70)/100*.25);
    S.stats.apps++; S.season.apps++; S.stats.minutes+=Math.floor(35+Math.random()*60);
    if(g){S.stats.goals++;S.season.goals++}
    if(a){S.stats.assists++;S.season.assists++}
    if(Math.random()<.06)S.stats.yellow++;
    if(Math.random()<.008)S.stats.red++;
    if(Math.random()<.018)p.injury='lesão muscular — 14 dias';
    if(rating>8&&p.ovr<p.potential)p.ovr++;
    p.popularity=Math.min(100,p.popularity+(g?4:1));
    p.followers+=g?Math.floor(350+Math.random()*800):Math.floor(40+Math.random()*180);
    S.finance.push({date:dateStr(),type:'Bônus de partida',v:g?650:250});
    S.news.unshift(g?`${p.name} marca em Vasco x Flamengo e vira destaque.`:`${p.name} participa da partida e segue em evolução.`);
    save();render();note(g?'⚽ GOL! Partida concluída!':'Partida concluída!');
  }finally{setTimeout(()=>window.__matchBusy=false,500)}
}
function advanceDay(days=1){
  days=Math.max(1,Math.min(30,Number(days)||1));
  for(let i=0;i<days;i++){
    S.date.d++;
    if(S.date.d>30){
      S.date.d=1;S.date.m++;
      if(S.date.m>12){
        S.date.m=1;S.date.y++;S.player.age++;
        S.history.push({year:S.date.y,age:S.player.age,club:S.player.club,apps:S.season.apps,goals:S.season.goals,assists:S.season.assists,ovr:S.player.ovr});
        S.season={apps:0,goals:0,assists:0};
        if(S.player.age>=30&&S.player.ovr>55)S.player.ovr--;
        if(S.player.age>=38&&S.player.ovr>45)S.player.ovr-=2;
        S.news.unshift(`Nova temporada: ${S.date.y}. ${S.player.name} agora tem ${S.player.age} anos.`);
      }
    }
    if(S.player.injury&&Math.random()<.12)S.player.injury=null;
    if(Math.random()<.08&&S.player.ovr<S.player.potential)S.player.ovr++;
    S.finance.push({date:dateStr(),type:'Salário diário',v:Math.round(S.player.salary/30)});
  }
  save();render();note(days===1?'Dia avançado':`${days} dias avançados`);
}

function newCareer(){if(confirm('Começar uma nova carreira? O jogador atual será substituído neste dispositivo.')){S=clone(base);S.id=Date.now();save();nav('create');note('Nova carreira pronta!')}}
function exportSave(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gaert-modo-carreiras-save.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('newCareerBtn').onclick=newCareer;document.getElementById('exportBtn').onclick=exportSave;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();nav('home');note('Save importado!')}catch{alert('Save inválido')}};r.readAsText(f)};
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q){S.news.unshift(`Busca realizada por “${q}”.`);save();note('Busca simulada no universo GAERT')}}};
function toggleThemeHint(){note('Interface GAERT já está no tema escuro premium.')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
nav('home');
</script>

<script>
(function(){
  function tick(){
    const e=document.getElementById('liveClock');
    if(e)e.textContent=new Date().toLocaleTimeString('pt-BR',{hour12:false});
  }
  tick();setInterval(tick,1000);
  window.addEventListener('pagehide',()=>{try{save()}catch(e){}});
  window.addEventListener('beforeunload',()=>{try{save()}catch(e){}});
})();
</script>
</body></html>
