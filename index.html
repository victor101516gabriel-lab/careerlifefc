function home(){let p=S.player,c=S.career;return `<section class="hero"><div class="hero-art"></div><div class="hero-content"><div class="eyebrow">VIVA SUA CARREIRA · ESCREVA SUA HISTÓRIA</div><h1>GAERT<br><span>MODO CARREIRAS</span></h1><p>Um modo carreira de futebol em que cada treino, partida, contrato e decisão muda o caminho do seu jogador. Comece na base e tente chegar ao topo.</p><div class="hero-actions"><button class="btn primary" onclick="nav('create')">✦ CRIAR / EDITAR JOGADOR</button><button class="btn ghost" onclick="nav('calendar')">▶ CONTINUAR CARREIRA</button><button class="btn green" onclick="startNextMatch()">⚽ JOGAR PRÓXIMA PARTIDA</button></div></div></section>
<div class="content-title"><h2>Painel da carreira</h2><small>${dateStr()} · Temporada ${c.season} · ${c.stage}</small></div>
<div class="grid g4"><div class="card"><div class="eyebrow">JOGADOR</div><div class="player-card" style="margin-top:8px"><div class="avatar">${p.shirt}</div><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.club)} · ${esc(p.level)}</div><span class="pill">OVR ${p.ovr}</span><span class="pill">${esc(c.role)}</span></div></div></div>${statBox('ENERGIA',Math.round(p.energy),p.energy)}${statBox('FORMA',Math.round(p.form),p.form)}${statBox('MORAL',Math.round(p.morale),p.morale)}</div>
<div class="content-title"><h2>O que fazer agora?</h2><small>Suas próximas ações</small></div><div class="grid g5">${feature('⚽','Partida','Entre em campo e controle a partida minuto a minuto.','nav(\'matches\')')}${feature('🏋️','Treino','Escolha a carga, evolua atributos e controle o desgaste.','nav(\'training\')')}${feature('🗓','Calendário','Veja os próximos jogos, datas e competições.','nav(\'calendar\')')}${feature('↔','Mercado','Receba propostas e decida seu futuro.','nav(\'market\')')}${feature('◆','Escolhas','Decisões de carreira com consequências.','nav(\'choices\')')}</div>
<div class="content-title"><h2>Temporada</h2><small>${S.teamTable.p} jogos · ${S.teamTable.pts} pontos</small></div><div class="card"><div class="stats">${statBox('JOGOS',S.season.apps)}${statBox('GOLS',S.season.goals)}${statBox('ASSISTÊNCIAS',S.season.assists)}${statBox('MINUTOS',S.season.minutes)}</div><div style="margin-top:12px"><div class="meter"><span>Confiança do treinador</span><b>${c.managerTrust}</b></div><div class="bar"><i style="width:${c.managerTrust}%"></i></div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card"><div class="content-title" style="margin:0 0 4px"><h2>📰 Notícias</h2><button class="mini-btn" onclick="nav('news')">Ver todas</button></div>${S.news.slice(0,4).map((n,i)=>`<div class="news-item"><div class="news-thumb">${['⚽','🔥','🌎','📣'][i%4]}</div><div class="news-copy"><b>${esc(n)}</b><small>GAERT NEWS · ${dateStr()}</small></div></div>`).join('')}</div><div class="card"><div class="content-title" style="margin:0 0 4px"><h2>📊 Temporada do jogador</h2><button class="mini-btn" onclick="nav('careers')">Detalhes</button></div>${seasonBars()}</div></div>`}
function seasonBars(){let s=S.season;return `<div class="meter"><span>Gols</span><b>${s.goals}</b></div><div class="bar"><i style="width:${Math.min(100,s.goals*8)}%"></i></div><div class="meter" style="margin-top:10px"><span>Assistências</span><b>${s.assists}</b></div><div class="bar"><i style="width:${Math.min(100,s.assists*8)}%"></i></div><div class="meter" style="margin-top:10px"><span>Média de nota</span><b>${s.apps?(s.ratingSum/s.apps).toFixed(1):'—'}</b></div>`}
function createPage(){let p=S.player;return `<div class="content-title"><h2>✦ Criar seu jogador</h2><small>As escolhas iniciais moldam sua carreira</small></div><div class="card"><form class="form" id="charForm"><div class="form-grid"><div class="field"><label>Nome</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Apelido</label><input name="nickname" value="${esc(p.nickname)}"></div><div class="field"><label>Data de nascimento</label><input type="date" name="birth" value="${p.birth}"></div><div class="field"><label>Nacionalidade</label><input name="nation" value="${esc(p.nation)}"></div><div class="field"><label>Cidade</label><input name="city" value="${esc(p.city)}"></div><div class="field"><label>Número</label><input type="number" min="1" max="99" name="shirt" value="${p.shirt}"></div><div class="field"><label>Posição</label><select name="position">${['Goleiro','Zagueiro','Lateral','Volante','Meia','Ponta','Atacante'].map(x=>`<option ${p.position===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Pé</label><select name="foot">${['Direito','Esquerdo','Ambidestro'].map(x=>`<option ${p.foot===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Estilo</label><select name="style">${['Meia criativo','Armador clássico','Ponta veloz','Finalizador','Volante completo','Defensor','Atacante móvel'].map(x=>`<option ${p.style===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Altura (cm)</label><input type="number" name="height" value="${p.height}"></div><div class="field"><label>Peso (kg)</label><input type="number" name="weight" value="${p.weight}"></div><div class="field"><label>Clube inicial</label><select name="club">${clubs.map(x=>`<option ${p.club===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>História de origem</label><textarea name="origin" placeholder="Conte de onde seu jogador veio, quem o inspirou e qual é o sonho dele.">${esc(p.origin||'Começou jogando na rua e sonha em viver do futebol.')}</textarea></div><div class="actions"><button class="btn primary">Salvar personagem</button><button type="button" class="btn" onclick="resetCareer()">Nova carreira do zero</button></div></form></div><div class="grid g3" style="margin-top:12px"><div class="card"><div class="eyebrow">ATRIBUTOS</div>${attrLine('Velocidade','pace')}${attrLine('Drible','dribble')}${attrLine('Passe','pass')}${attrLine('Finalização','finish')}${attrLine('Físico','strength')}${attrLine('Visão','vision')}</div><div class="card"><div class="eyebrow">PERSONALIDADE</div>${attrLine('Profissionalismo','pro')}${attrLine('Ambição','amb')}${attrLine('Liderança','lead')}${attrLine('Humildade','hum')}${attrLine('Temperamento','temp')}${attrLine('Lealdade','loyal')}</div><div class="card"><div class="eyebrow">PERFIL</div><h2 style="margin:8px 0">OVR ${p.ovr}</h2><p class="muted">Potencial ${p.potential}. O desenvolvimento depende de treino, minutos, decisões, forma e idade.</p><span class="pill">${p.position}</span><span class="pill">${p.style}</span><span class="pill">${p.foot}</span></div></div>`}
function attrLine(l,k){return `<div style="margin:10px 0"><div class="meter"><span>${l}</span><b>${S.player[k]}</b></div><div class="bar"><i style="width:${S.player[k]}%"></i></div></div>`}
function careers(){let p=S.player,c=S.career;return `<div class="content-title"><h2>Minha carreira</h2><small>Temporada ${c.season} · ${c.stage}</small></div><div class="grid g3"><div class="card"><div class="eyebrow">STATUS</div><h2 style="margin:7px 0">${esc(p.name)}</h2><div class="muted">${esc(p.club)} · ${esc(p.level)}</div><div style="margin-top:10px"><span class="pill">OVR ${p.ovr}</span><span class="pill">Pot ${p.potential}</span><span class="pill">${c.role}</span></div></div><div class="card"><div class="eyebrow">TEMPORADA</div><h2>${S.season.apps} <small class="muted">jogos</small></h2><div class="muted">${S.season.goals} gols · ${S.season.assists} assistências</div></div><div class="card"><div class="eyebrow">CARREIRA TOTAL</div><h2>${S.stats.apps}</h2><div class="muted">${S.stats.goals} gols · ${S.stats.assists} assistências · ${S.stats.minutes} min</div></div></div><div class="content-title"><h2>Histórico</h2><small>O caminho que você construiu</small></div><div class="card"><table class="table"><thead><tr><th>Ano</th><th>Idade</th><th>Clube</th><th>Jogos</th><th>Gols</th><th>OVR</th></tr></thead><tbody>${S.history.slice().reverse().map(h=>`<tr><td>${h.year}</td><td>${h.age}</td><td>${esc(h.club)}</td><td>${h.apps}</td><td>${h.goals}</td><td><b>${h.ovr}</b></td></tr>`).join('')}</tbody></table></div><div class="content-title"><h2>Objetivos</h2></div><div class="grid g3"><div class="card"><b>🏃 Ganhar espaço</b><p class="muted">Chegue a 70 de confiança do treinador.</p><span class="badge">${c.managerTrust}/70</span></div><div class="card"><b>⚽ Primeira grande temporada</b><p class="muted">Marque 10 gols na temporada.</p><span class="badge">${S.season.goals}/10</span></div><div class="card"><b>🇧🇷 Seleção</b><p class="muted">Aumente OVR, forma e reputação para ser convocado.</p><span class="badge">${S.national.called?'CONVOCADO':'EM OBSERVAÇÃO'}</span></div></div>`}
function makeSeason(pl,dt){pl=pl||base.player;dt=dt||base.date;let club=pl.club||base.player.club;let arr=[];let start=new Date(dt.y,dt.m-1,dt.d);for(let i=0;i<18;i++){let d=new Date(start);d.setDate(d.getDate()+i*4+2);let opp=opponents[(i+1)%opponents.length];arr.push({id:i+1,date:d.toISOString().slice(0,10),home:i%2===0?club:opp,away:i%2===0?opp:club,comp:i%5===0?'Copa do Brasil':'Brasileirão',played:false,result:null,goals:null,awayGoals:null});}return arr}
function calendar(){let upcoming=S.calendar.filter(x=>!x.played).slice(0,10);return `<div class="content-title"><h2>🗓 Calendário</h2><small>${dateStr()} · próximos compromissos</small></div><div class="card"><div class="calendar">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div class="day" style="min-height:auto"><strong>${x}</strong></div>`).join('')}</div><div style="margin-top:10px">${upcoming.map((m,i)=>{let d=new Date(m.date+'T12:00:00');return `<div class="fixture"><div class="fixture-date">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}<br><span class="tag">${m.comp}</span></div><div class="fixture-teams"><b>${esc(m.home)} × ${esc(m.away)}</b><small>${i===0?'Próxima partida':'Rodada '+(i+1)}</small></div><div class="fixture-result">—</div><button class="btn small ${i===0?'primary':''}" onclick="startScheduled(${m.id})">${i===0?'Jogar':'Abrir'}</button></div>`}).join('')}</div></div><div class="content-title"><h2>Regulamento da temporada</h2></div><div class="grid g3"><div class="card"><b>🏆 Brasileirão</b><p class="muted">Pontos, vitórias, saldo e disputa por posições.</p></div><div class="card"><b>🏆 Copa do Brasil</b><p class="muted">Mata-mata com pressão e decisões de alto risco.</p></div><div class="card"><b>🌎 Próximo objetivo</b><p class="muted">Classificação continental depende dos resultados da temporada.</p></div></div>`}
function squad(){let p=S.player;let names=[p.name,'Luan Ribeiro','João Pedro','Mateus Silva','Caio Mendes','Arthur Lima','Rafael Costa','Bruno Alves','Henrique Souza','Diego Ramos','Lucas Melo'];return `<div class="content-title"><h2>👥 Elenco</h2><small>${p.club} · grupo atual</small></div><div class="grid g3">${names.map((n,i)=>`<div class="card"><div class="player-card"><div class="rank-avatar">${i===0?p.shirt:i+1}</div><div style="flex:1"><b>${esc(n)}</b><small class="muted" style="display:block">${i===0?p.position:['Goleiro','Zagueiro','Volante','Meia','Ponta','Atacante'][i%6]} · ${i===0?p.ovr:60+i}</small></div>${i===0?'<span class="badge">VOCÊ</span>':''}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="eyebrow">DENTRO DO VESTIÁRIO</div><p class="muted">Moral do elenco: ${S.career.teamMorale}/100. Liderança, resultados e escolhas influenciam a relação com seus companheiros.</p><div class="bar"><i style="width:${S.career.teamMorale}%"></i></div></div>`}
function training(){let p=S.player;return `<div class="content-title"><h2>🏋️ Centro de Treinamento</h2><small>Energia ${Math.round(p.energy)} · Fadiga ${Math.round(p.fatigue)} · Forma ${Math.round(p.form)}</small></div><div class="grid g3">${trainCard('⚡','Velocidade','pace','Velocidade',14)}${trainCard('🪄','Drible','dribble','Drible',14)}${trainCard('🎯','Finalização','finish','Finalização',15)}${trainCard('🎯','Passe','pass','Passe',13)}${trainCard('💪','Físico','strength','Físico',18)}${trainCard('🧠','Visão de jogo','vision','Visão',12)}</div><div class="content-title"><h2>Plano semanal</h2><small>Organize a carga</small></div><div class="card"><div class="grid g4">${Object.entries(S.weekPlan).map(([d,v])=>`<div class="field"><label>${d.toUpperCase()}</label><select onchange="setPlan('${d}',this.value)"><option value="light" ${v==='light'?'selected':''}>Leve</option><option value="medium" ${v==='medium'?'selected':''}>Média</option><option value="heavy" ${v==='heavy'?'selected':''}>Pesada</option><option value="rest" ${v==='rest'?'selected':''}>Descanso</option><option value="match" ${v==='match'?'selected':''}>Partida</option></select></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="applyWeekPlan()">Aplicar plano de hoje</button><button class="btn green" onclick="restDay()">😴 Descansar</button></div></div>`}
function trainCard(icon,name,key,label,cost){return `<div class="card"><div style="font-size:28px">${icon}</div><h3 style="margin:7px 0">${name}</h3><div class="muted">Atributo ${S.player[key]} · custo de energia ${cost}</div><div class="bar" style="margin:9px 0"><i style="width:${S.player[key]}%"></i></div><button class="btn primary small" onclick="train('${key}','${label}',${cost})">Treinar</button></div>`}
function train(k,label,cost){if(busy)return;let p=S.player;if(p.injury){note('Você está lesionado.');return}if(p.energy<cost){note('Energia insuficiente.');return}busy=true;let gain=1+Math.floor(Math.random()*2);if(p.fatigue>70)gain=1;p[k]=clamp(p[k]+gain,1,99);p.energy=clamp(p.energy-cost,0,100);p.fatigue=clamp(p.fatigue+Math.round(cost*.8),0,100);p.form=clamp(p.form+1,0,100);if(p.ovr<p.potential&&Math.random()<.55)p.ovr++;S.news.unshift(`${p.name} trabalhou ${label.toLowerCase()} no treino e evoluiu ${gain} ponto.`);save();render();note(`🏋️ ${label}: +${gain}`);setTimeout(()=>busy=false,250)}
function setPlan(d,v){S.weekPlan[d]=v;save();note('Plano atualizado.')}
function applyWeekPlan(){let d=dateObj().toLocaleDateString('en-US',{weekday:'short'}).toLowerCase().slice(0,3);let map={mon:'mon',tue:'tue',wed:'wed',thu:'thu',fri:'fri',sat:'sat',sun:'sun'};let v=S.weekPlan[map[d]]||'medium';if(v==='rest')restDay();else if(v==='match')note('Hoje é dia de partida: vá para Partidas.');else {let costs={light:8,medium:14,heavy:22};S.player.energy=clamp(S.player.energy-costs[v],0,100);S.player.fatigue=clamp(S.player.fatigue+costs[v]*.7,0,100);S.player.form=clamp(S.player.form+(v==='heavy'?2:1),0,100);if(S.player.ovr<S.player.potential&&v==='heavy'&&Math.random()<.4)S.player.ovr++;save();render();note(`📋 Sessão ${v==='heavy'?'pesada':v==='medium'?'média':'leve'} aplicada.`)}}
function restDay(){S.player.energy=clamp(S.player.energy+24,0,100);S.player.fatigue=clamp(S.player.fatigue-25,0,100);S.player.form=clamp(S.player.form+2,0,100);S.player.morale=clamp(S.player.morale+1,0,100);if(S.player.injury&&Math.random()<.35)S.player.injury=null;addDays(1);save();render();note('😴 Recuperação concluída. Dia avançado.')}
function choices(){let p=S.player;return `<div class="content-title"><h2>◆ Escolhas da carreira</h2><small>Decisões com consequências</small></div><div class="grid g2">${choiceCard('Agente','Um clube maior demonstra interesse, mas você teria menos minutos.',['Buscar crescimento','Priorizar titularidade','Ficar no clube'],['amb','pro','loyal'])}${choiceCard('Treinador','O treinador quer saber se você aceita jogar em outra posição.',['Aceitar o desafio','Pedir tempo','Recusar'],['pro','hum','temp'])}${choiceCard('Imprensa','Uma entrevista pergunta sobre seu futuro.',['Falar com ambição','Ser discreto','Reafirmar lealdade'],['amb','hum','loyal'])}${choiceCard('Vestiário','Um companheiro mais velho pede sua ajuda.',['Ajudar','Manter foco individual','Assumir liderança'],['lead','pro','lead'])}</div><div class="content-title"><h2>Histórico de decisões</h2></div><div class="card">${S.choices.length?S.choices.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small class="muted" style="display:block">${esc(x.choice)}</small></div><span class="badge">${esc(x.date)}</span></div>`).join(''):'<div class="empty">Nenhuma decisão registrada ainda.</div>'}</div>`}
function choiceCard(title,text,opts,keys){return `<div class="card"><div class="eyebrow">${title.toUpperCase()}</div><h3>${text}</h3><div class="choice-buttons">${opts.map((o,i)=>`<button onclick="makeChoice('${title}','${o}',${i},'${keys[i]}')">${o} →</button>`).join('')}</div></div>`}
function makeChoice(title,choice,i,key){let p=S.player;let delta=i===0?4:i===1?1:2;p[key]=clamp(p[key]+delta,0,100);if(title==='Agente'&&i===0){S.career.managerTrust=Math.max(0,S.career.managerTrust-2);S.player.ambition=clamp(p.ambition+3,0,100)}if(title==='Vestiário'&&i===2)S.career.teamMorale=clamp(S.career.teamMorale+4,0,100);if(title==='Imprensa'){p.popularity=clamp(p.popularity+(i===0?4:2),0,100);p.followers+=Math.floor(80+Math.random()*220)}S.choices.push({title,choice,date:dateStr()});S.news.unshift(`${p.name} tomou uma decisão: ${choice.toLowerCase()}.`);save();render();note('◆ Decisão registrada e aplicada.')}
function matches(){if(S.match?.status==='live')return matchCenter();let next=S.calendar.find(x=>!x.played);return `<div class="content-title"><h2>⚽ Partidas</h2><small>Próximo jogo: ${next?esc(next.home+' × '+next.away):'fim da temporada'}</small></div><div class="grid g3"><div class="card"><div class="eyebrow">PRÓXIMA PARTIDA</div><h2 style="margin:8px 0">${next?esc(next.home)+' × '+esc(next.away):'Sem jogo'}</h2><p class="muted">${next?esc(next.comp)+' · '+new Date(next.date+'T12:00:00').toLocaleDateString('pt-BR'):''}</p><button class="btn primary" onclick="${next?`startScheduled(${next.id})`:'nav(\'calendar\')'}">⚽ Entrar em campo</button></div><div class="card"><div class="eyebrow">FORMA</div><h2>${S.player.form}</h2><p class="muted">Energia ${Math.round(S.player.energy)} · Moral ${S.player.morale}</p></div><div class="card"><div class="eyebrow">CONFIANÇA</div><h2>${S.career.managerTrust}</h2><p class="muted">${S.career.role}. O desempenho altera seu espaço.</p></div></div><div class="content-title"><h2>Últimas partidas</h2></div><div class="card">${S.calendar.filter(x=>x.played).slice().reverse().slice(0,8).map(m=>`<div class="fixture"><div class="fixture-date">${new Date(m.date+'T12:00:00').toLocaleDateString('pt-BR')}</div><div class="fixture-teams"><b>${esc(m.home)} × ${esc(m.away)}</b><small>${esc(m.comp)}</small></div><div class="fixture-result">${m.goals} × ${m.awayGoals}</div></div>`).join('')||'<div class="empty">Você ainda não jogou partidas.</div>'}</div>`}
function startNextMatch(){let m=S.calendar.find(x=>!x.played);if(m)startScheduled(m.id);else note('Não há partidas no calendário.')}
function startScheduled(id){let m=S.calendar.find(x=>x.id===id);if(!m||m.played)return;if(S.match?.status==='live'){nav('matches');return}if(S.player.injury){note('Você está lesionado.');return}let home=m.home,away=m.away;S.match={status:'live',fixtureId:id,minute:0,added:0,home,away,homeGoals:0,awayGoals:0,comp:m.comp,tactic:'balanced',rating:6,energy:clamp(S.player.energy,25,100),events:[],pending:null,stats:{shots:0,dribbles:0,passes:0,keyPasses:0,assists:0,goals:0,ballRecoveries:0},yellow:false,red:false,subbed:false};addMatchEvent(0,'🟢','Bola rolando.',`${S.player.name} ${S.player.ovr>=S.career.managerTrust?'começa como titular':'começa buscando espaço no elenco'}.`);save();nav('matches');note('⚽ Partida iniciada!')}
function addMatchEvent(minute,icon,text,detail=''){if(S.match)S.match.events.push({minute,icon,text,detail})}
function matchCenter(){let m=S.match,p=S.player;return `<div class="content-title"><h2>⚽ Central da partida</h2><small>${m.status==='live'?'AO VIVO':'FIM DE JOGO'}</small></div><div class="match-shell"><div class="scoreboard"><div class="comp">${esc(m.comp)} · ${esc(dateStr())}</div><div class="score"><div class="team"><b>${esc(m.home)}</b><small>CASA</small></div><div><div class="score-num">${m.homeGoals} × ${m.awayGoals}</div><span class="minute">${m.minute>=90?'90+':m.minute+"'"}</span></div><div class="team"><b>${esc(m.away)}</b><small>FORA</small></div></div></div><div class="match-body"><div><div class="card" style="margin-bottom:12px"><div class="eyebrow">COMANDO TÁTICO</div><div class="tactic-grid" style="margin-top:9px">${[['attack','⚔ Ataque'],['balanced','⚖ Equilibrado'],['safe','🛡 Segurança'],['risk','🔥 Risco']].map(([k,l])=>`<button class="tactic ${m.tactic===k?'active':''}" onclick="matchTactic('${k}')">${l}</button>`).join('')}</div><div class="actions" style="margin-top:9px"><button class="btn small" onclick="matchNext(1)">+1 min</button><button class="btn small" onclick="matchNext(5)">+5 min</button><button class="btn small" onclick="matchNext(10)">+10 min</button><button class="btn small danger" onclick="finishForfeit()">Encerrar</button></div></div>${m.pending?`<div class="choice-box"><div class="eyebrow">DECISÃO EM CAMPO</div><h3>${esc(m.pending.title)}</h3><p>${esc(m.pending.text)}</p><div class="choice-buttons">${m.pending.options.map((o,i)=>`<button onclick="resolveMatchChoice(${i})">${o}</button>`).join('')}</div></div>`:''}<div class="card"><div class="eyebrow">EVENTOS DA PARTIDA</div><div class="event-feed">${m.events.slice().reverse().map(e=>`<div class="match-event"><span class="min">${e.minute}'</span><span class="evicon">${e.icon}</span><div><b>${esc(e.text)}</b>${e.detail?`<small>${esc(e.detail)}</small>`:''}</div></div>`).join('')}</div></div></div><div><div class="card"><div class="eyebrow">SEU DESEMPENHO</div>${statBox('NOTA',m.rating.toFixed(1),m.rating*10)}${statBox('ENERGIA',Math.round(m.energy),m.energy)}<div class="statline"><span>Finalizações</span><b>${m.stats.shots}</b></div><div class="statline"><span>Dribles</span><b>${m.stats.dribbles}</b></div><div class="statline"><span>Passes</span><b>${m.stats.passes}</b></div><div class="statline"><span>Passes-chave</span><b>${m.stats.keyPasses}</b></div><div class="statline"><span>Gols</span><b>${m.stats.goals}</b></div><div class="statline"><span>Assistências</span><b>${m.stats.assists}</b></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">INSTRUÇÃO DO TREINADOR</div><p class="muted">${coachInstruction()}</p></div></div></div></div>`}
function coachInstruction(){let t=S.career.managerTrust;if(t>=75)return'“Você ganhou minha confiança. Procure decidir o jogo.”';if(t>=55)return'“Jogue simples, mas seja agressivo quando aparecer espaço.”';return'“Mostre intensidade. Cada minuto conta para ganhar seu lugar.”'}
function matchTactic(t){if(S.match?.status!=='live')return;S.match.tactic=t;addMatchEvent(S.match.minute,'🧠','Mudança tática.',`A equipe adotou ${t==='attack'?'postura ofensiva':t==='safe'?'mais segurança':t==='risk'?'risco máximo':'equilíbrio'}.`);save();render()}
function generatePending(){let m=S.match,p=S.player;if(m.pending||Math.random()>0.12)return;let r=Math.random();if(r<.35)m.pending={title:`${m.minute}' — Você recebe entre as linhas`,text:'Há espaço para decidir a próxima ação.',options:['Passe vertical','Drible agressivo','Segurar a posse'],effects:[{rating:.25,energy:-2,pass:1,key:1,assist:.12,label:'Passe vertical'},{rating:.2,energy:-5,dribble:1,shot:.35,goal:Math.min(.42,p.finish/180),label:'Drible agressivo'},{rating:.12,energy:-1,pass:1,label:'Posse segura'}]};else if(r<.7)m.pending={title:`${m.minute}' — Bola na entrada da área`,text:'Você pode finalizar ou procurar um companheiro.',options:['Chutar','Cortar e chutar','Dar assistência'],effects:[{rating:.25,energy:-5,shot:1,goal:Math.min(.45,p.finish/170),label:'Finalização'},{rating:.28,energy:-6,dribble:1,shot:1,goal:Math.min(.5,p.finish/155),label:'Corte para dentro'},{rating:.3,energy:-2,pass:1,key:1,assist:.18,label:'Passe para gol'}]};else m.pending={title:`${m.minute}' — Contra-ataque adversário`,text:'O adversário acelera pelo seu setor.',options:['Pressionar','Fechar linha','Recompor'],effects:[{rating:.3,energy:-6,recover:1,label:'Pressão intensa'},{rating:.18,energy:-3,recover:1,label:'Linha fechada'},{rating:.1,energy:-1,label:'Recomposição'}]}}
function resolveMatchChoice(i){let m=S.match,e=m.pending.effects[i],p=S.player;m.pending=null;m.rating=clamp(m.rating+e.rating,4,10);m.energy=clamp(m.energy+e.energy,0,100);if(e.pass)m.stats.passes++;if(e.key)m.stats.keyPasses++;if(e.dribble){m.stats.dribbles++;if(Math.random()<.3)m.rating=clamp(m.rating+.15,4,10)}if(e.recover)m.stats.ballRecoveries++;if(e.shot){m.stats.shots++;if(Math.random()<(e.goal||.1)){m.stats.goals++;m.homeGoals+=(m.home===p.club?1:0);m.awayGoals+=(m.away===p.club?1:0);m.rating=clamp(m.rating+.8,4,10);addMatchEvent(m.minute,'⚽',`${p.name} MARCA!`,'Finalização perfeita após a decisão em campo.');}else addMatchEvent(m.minute,'💥',`${p.name} finaliza.`,'O goleiro defendeu ou a bola saiu por pouco.')}if(e.assist&&Math.random()<e.assist){m.stats.assists++;m.rating=clamp(m.rating+.6,4,10);addMatchEvent(m.minute,'🅰️',`${p.name} dá a assistência!`,'Passe decisivo que deixa o companheiro em condição de marcar.')}addMatchEvent(m.minute,'🎮',e.label,'Sua decisão mudou a jogada.');save();render()}
function matchNext(n){let m=S.match;if(!m||m.status!=='live')return;if(m.pending){note('Tome a decisão antes de avançar.');return}for(let i=0;i<n&&m.status==='live';i++)matchMinute();save();render()}
function matchMinute(){let m=S.match,p=S.player;if(!m||m.status!=='live')return;m.minute++;let tacticCost={attack:1.05,balanced:.78,safe:.58,risk:1.3}[m.tactic]||.78;m.energy=clamp(m.energy-(.34+tacticCost*.22),0,100);let ability=(p.ovr/100)*(m.energy/100)*(p.form/100);let r=Math.random();if(r<.012+(m.tactic==='risk'?.008:0)){let side=Math.random()<.5?'home':'away';if(side==='home')m.homeGoals++;else m.awayGoals++;addMatchEvent(m.minute,'⚽',side==='home'?`${m.home} marca!`:`${m.away} marca!`,'Uma jogada rápida muda o placar.');m.rating=clamp(m.rating+(side===p.club?.5:-.12),4,10)}else if(r<.035){addMatchEvent(m.minute,'💥','Finalização perigosa.','A bola passou perto da trave.')}else if(r<.05){addMatchEvent(m.minute,'🥅','Grande defesa.','O goleiro salva uma chance clara.')}else if(r<.063){addMatchEvent(m.minute,'🚩','Escanteio.','A defesa afasta o cruzamento.')}else if(r<.073){addMatchEvent(m.minute,'🟨','Cartão amarelo.','Entrada forte no meio-campo.');if(Math.random()<.3){m.yellow=true;p.morale=clamp(p.morale-1,0,100)}}else if(r<.078){addMatchEvent(m.minute,'🩹','Atendimento médico.','Um jogador recebe atendimento após uma dividida.');if(Math.random()<.06){p.injury='Contusão muscular';addMatchEvent(m.minute,'🚑',`${p.name} sente e precisa sair.`,'O departamento médico vai avaliar o jogador.');m.subbed=true}}else if(r<.12){addMatchEvent(m.minute,'⚡','Transição rápida.','As duas equipes aceleram o jogo.')}if(Math.random()<.11*ability)m.stats.passes++;if(Math.random()<.045*(p.dribble/80)*ability)m.stats.dribbles++;if(Math.random()<.026*(p.finish/75)*ability)m.stats.shots++;if(Math.random()<.018*(p.vision/80)*ability)m.stats.keyPasses++;if(m.minute===45)addMatchEvent(45,'⏸️','Intervalo.','O treinador reorganiza a equipe.');generatePending();if(m.energy<12&&Math.random()<.18){m.rating=clamp(m.rating-.1,4,10);addMatchEvent(m.minute,'😮‍💨',`${p.name} sente o desgaste.`,'Talvez seja hora de diminuir o ritmo.')}if(m.minute>=90)finishMatch()}
function finishMatch(forfeit=false){let m=S.match,p=S.player;if(!m||m.status!=='live')return;m.status='finished';m.pending=null;if(forfeit){m.rating=4.5;m.forfeit=true;addMatchEvent(m.minute,'🛑','Partida encerrada antes do fim.','Saída antecipada registrada.')}let ownHome=m.home===p.club;let result=ownHome?(m.homeGoals>m.awayGoals?'W':m.homeGoals<m.awayGoals?'L':'D'):(m.awayGoals>m.homeGoals?'W':m.awayGoals<m.homeGoals?'L':'D');if(result==='W')m.rating=clamp(m.rating+.3,4,10);if(result==='L')m.rating=clamp(m.rating-.2,4,10);let started=m.rating>=6.7||p.ovr>=72;S.stats.apps++;S.season.apps++;if(started){S.stats.starts++;S.season.starts++}S.stats.minutes+=m.minute;S.season.minutes+=m.minute;for(const k of ['goals','assists','shots','dribbles','passes']){S.stats[k]+=m.stats[k];S.season[k]+=m.stats[k]}S.season.ratingSum+=m.rating;p.energy=clamp(m.energy,0,100);p.fatigue=clamp(p.fatigue+(82-m.energy)*.22,0,100);p.form=clamp(p.form+(m.rating>=7.5?5:m.rating>=6.5?2:-3),0,100);p.morale=clamp(p.morale+(result==='W'?5:result==='D'?1:-4),0,100);S.career.managerTrust=clamp(S.career.managerTrust+(m.rating>=7.5?4:m.rating<5.8?-4:1),0,100);S.teamTableUpdate=result;S.teamTable.p++;if(result==='W'){S.teamTable.w++;S.teamTable.pts+=3}else if(result==='D'){S.teamTable.d++;S.teamTable.pts++}else S.teamTable.l++;S.teamTable.gf+=m.home===p.club?m.homeGoals:m.awayGoals;S.teamTable.ga+=m.home===p.club?m.awayGoals:m.homeGoals;let fx=S.calendar.find(x=>x.id===m.fixtureId);if(fx){fx.played=true;fx.goals=m.homeGoals;fx.awayGoals=m.awayGoals;fx.result=result}if(m.stats.goals&&p.ovr<p.potential)p.ovr++;if(m.stats.goals)p.value=Math.round(p.value*1.04);p.followers+=Math.floor(40+Math.random()*160)+(m.stats.goals*500);S.finance.push({date:dateStr(),type:'Bônus de partida',v:Math.round(250+m.rating*80)});S.finances.balance+=Math.round(250+m.rating*80);S.finances.careerIncome+=Math.round(250+m.rating*80);S.news.unshift(`${p.name} terminou ${m.homeGoals} × ${m.awayGoals} contra ${p.club===m.home?m.away:m.home}, com nota ${m.rating.toFixed(1)}.`);if(m.stats.goals)S.news.unshift(`⚽ ${p.name} marcou e ganhou destaque após a partida.`);if(m.stats.assists)S.news.unshift(`🅰️ ${p.name} participou diretamente de um gol.`);if(m.stats.goals||m.stats.assists||m.rating>=8){p.popularity=clamp(p.popularity+3,0,100)}S.history[S.history.length-1].apps=S.stats.apps;S.history[S.history.length-1].goals=S.stats.goals;S.history[S.history.length-1].assists=S.stats.assists;S.history[S.history.length-1].ovr=p.ovr;save();render();note(`🏁 Fim de jogo · Nota ${m.rating.toFixed(1)}`)}
function finishForfeit(){if(!S.match||S.match.status!=='live')return; if(confirm('Encerrar a partida agora? Isso será registrado como uma saída antecipada.')){finishMatch(true)}}
function startMatchV7(){startNextMatch()}
function postMatch(){let m=S.match;if(!m)return'';let result=m.homeGoals>m.awayGoals?'VITÓRIA':m.homeGoals<m.awayGoals?'DERROTA':'EMPATE';return `<div class="content-title"><h2>🏁 Fim de jogo</h2><small>${result}</small></div><div class="grid g2"><div class="card"><div class="scoreboard" style="border-radius:12px"><div class="score"><div class="team"><b>${esc(m.home)}</b></div><div class="score-num">${m.homeGoals} × ${m.awayGoals}</div><div class="team"><b>${esc(m.away)}</b></div></div></div><h2>Nota ${m.rating.toFixed(1)}</h2><p class="muted">${m.stats.goals} gol · ${m.stats.assists} assistência · ${m.stats.dribbles} dribles</p><button class="btn primary" onclick="S.match=null;save();nav('matches')">Voltar</button></div><div class="card"><div class="eyebrow">EVENTOS</div>${m.events.slice().reverse().slice(0,12).map(e=>`<div class="match-event"><span class="min">${e.minute}'</span><span>${e.icon}</span><div>${esc(e.text)}</div></div>`).join('')}</div></div>`}
function market(){let p=S.player;let offers=S.offers;return `<div class="content-title"><h2>↔ Mercado de transferências</h2><small>Reputação ${p.popularity} · Valor ${fmt(p.value)}</small></div><div class="card"><div class="eyebrow">SITUAÇÃO</div><h2>${esc(p.club)}</h2><p class="muted">${p.level} · contrato ${p.contract} ano(s) · salário ${fmt(p.salary)}/mês</p><button class="btn primary" onclick="generateOffer()">🔎 Procurar interesse</button></div><div class="content-title"><h2>Propostas recebidas</h2></div><div class="grid g2">${offers.length?offers.slice().reverse().map((o,i)=>`<div class="card"><span class="badge">PROPOSTA</span><h3>${esc(o.club)}</h3><p class="muted">${o.role} · ${fmt(o.salary)}/mês · ${o.years} anos</p><p>Valor do negócio: <b>${fmt(o.fee)}</b></p><div class="actions"><button class="btn green small" onclick="acceptOffer(${S.offers.length-1-i})">Aceitar</button><button class="btn small" onclick="rejectOffer(${S.offers.length-1-i})">Recusar</button></div></div>`).join(''):'<div class="card empty">Nenhuma proposta ainda. Jogue, evolua e aumente sua reputação.</div>'}</div>`}
function generateOffer(){let choices=clubs.filter(x=>x!==S.player.club),club=choices[Math.floor(Math.random()*choices.length)];let o={club,role:Math.random()<.55?'Rotação':'Titular',salary:Math.max(S.player.salary+500,Math.round(S.player.salary*(1.4+Math.random()*2))),years:2+Math.floor(Math.random()*3),fee:Math.round(S.player.value*(1.2+Math.random()*2.2))};S.offers.push(o);S.news.unshift(`Mercado: ${club} consultou a situação de ${S.player.name}.`);save();render();note(`📨 Proposta de ${club}`)}
function acceptOffer(i){let o=S.offers[i];if(!o)return;let old=S.player.club;S.player.club=o.club;S.player.salary=o.salary;S.player.contract=o.years;S.player.level='Profissional';S.career.stage='Profissional';S.career.role=o.role;S.transferHistory.push({date:dateStr(),from:old,to:o.club,fee:o.fee});S.player.value=Math.round(S.player.value*1.15);S.history.push({year:S.date.y,age:S.player.age,club:o.club,apps:S.stats.apps,goals:S.stats.goals,assists:S.stats.assists,ovr:S.player.ovr});S.offers.splice(i,1);S.news.unshift(`${S.player.name} acertou com o ${o.club}. Novo capítulo na carreira.`);S.calendar=makeSeason();save();render();note(`✍ Transferência para ${o.club} concluída!`)}
function rejectOffer(i){S.offers.splice(i,1);save();render();note('Proposta recusada.')}
function contracts(){let p=S.player;return `<div class="content-title"><h2>✍ Contrato</h2><small>Negocie seu futuro</small></div><div class="grid g3"><div class="card"><div class="eyebrow">CLUBE</div><h2>${esc(p.club)}</h2><p class="muted">${p.level} · ${p.contract} ano(s)</p></div><div class="card"><div class="eyebrow">SALÁRIO</div><h2>${fmt(p.salary)}</h2><p class="muted">por mês</p></div><div class="card"><div class="eyebrow">VALOR DE MERCADO</div><h2>${fmt(p.value)}</h2><p class="muted">Baseado em OVR, idade e reputação.</p></div></div><div class="card" style="margin-top:12px"><h3>Renovação</h3><p class="muted">A diretoria avalia desempenho, potencial e importância no elenco.</p><button class="btn primary" onclick="renewContract()">Negociar renovação</button></div><div class="content-title"><h2>Histórico de transferências</h2></div><div class="card">${S.transferHistory.length?S.transferHistory.slice().reverse().map(t=>`<div class="row"><div><b>${esc(t.from)}</b> → <b>${esc(t.to)}</b><small class="muted" style="display:block">${t.date}</small></div><span>${fmt(t.fee)}</span></div>`).join(''):'<div class="empty">Nenhuma transferência registrada.</div>'}</div>`}
function renewContract(){let p=S.player;let raise=Math.round(p.salary*(.18+p.popularity/500));p.salary+=raise;p.contract=Math.min(5,p.contract+2);p.morale=clamp(p.morale+4,0,100);S.news.unshift(`${p.name} renovou com o ${p.club} após uma boa fase.`);save();render();note('✍ Contrato renovado!')}
function news(){return `<div class="content-title"><h2>📰 Notícias</h2><small>O mundo reage à sua carreira</small></div><div class="grid g2"><div class="card">${S.news.map((n,i)=>`<div class="news-item"><div class="news-thumb">${['⚽','🔥','📰','🌎','📣'][i%5]}</div><div class="news-copy"><b>${esc(n)}</b><small>${dateStr()} · GAERT NEWS</small></div></div>`).join('')}</div><div class="card"><div class="eyebrow">TERMÔMETRO DA CARREIRA</div><h2>${punchline()}</h2><p class="muted">Popularidade ${S.player.popularity}/100 · Seguidores ${S.player.followers.toLocaleString('pt-BR')} · OVR ${S.player.ovr}</p><div class="bar"><i style="width:${S.player.popularity}%"></i></div></div></div>`}
function punchline(){let p=S.player;if(p.ovr>=85)return'“Craque em ascensão: o mercado já olha para o próximo salto.”';if(p.popularity>=65)return'“O nome começa a ganhar força entre os torcedores.”';if(S.season.goals>=10)return'“Artilheiro da temporada, Gaert vive seu melhor momento.”';return'“Uma carreira ainda no começo, mas cheia de possibilidades.”'}
function instagram(){let p=S.player;return `<div class="content-title"><h2>◎ Instagram</h2><button class="btn primary small" onclick="newPost()">+ Nova publicação</button></div><div class="card"><div class="player-card"><div class="avatar">${p.shirt}</div><div style="flex:1"><h2 style="margin:0">@${esc((p.nickname||p.name).toLowerCase().replace(/\s+/g,''))}</h2><p class="muted">${esc(p.name)} · ${esc(p.club)} · ${esc(p.position)}</p><span class="pill">${p.followers.toLocaleString('pt-BR')} seguidores</span><span class="pill">${p.popularity}% popularidade</span></div></div></div><div class="content-title"><h2>Publicações</h2></div><div class="grid g2">${S.posts.map(x=>`<div class="card"><div class="eyebrow">${x.date}</div><p style="font-size:15px">${esc(x.text)}</p><div class="muted">♥ ${x.likes} · 💬 ${x.comments}</div></div>`).join('')}</div>`}
function newPost(){openModal(`<div class="modal-head"><h2>Nova publicação</h2><button class="close" onclick="closeModal()">✕</button></div><form class="form" id="postForm"><div class="field"><label>Texto</label><textarea name="text" required placeholder="Escreva algo sobre sua carreira..."></textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Publicar</button></div></form>`);document.getElementById('postForm').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('text'),likes=Math.floor(40+S.player.followers*.03+Math.random()*500);S.posts.unshift({text:t,likes,comments:Math.floor(likes*.05),date:dateStr()});S.player.followers+=Math.floor(likes*.08);S.player.popularity=clamp(S.player.popularity+2,0,100);S.news.unshift(`${S.player.name} movimentou as redes com uma nova publicação.`);save();closeModal();render();note('📱 Publicado!')}}
function finance(){let f=S.finances;return `<div class="content-title"><h2>💰 Finanças</h2><small>Controle da vida profissional</small></div><div class="grid g4">${statBox('SALDO',fmt(f.balance))}${statBox('SALÁRIO',fmt(S.player.salary))}${statBox('RECEITAS',fmt(f.careerIncome))}${statBox('DESPESAS',fmt(f.expenses))}</div><div class="content-title"><h2>Movimentações</h2></div><div class="card">${S.finance.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.type)}</b><small class="muted" style="display:block">${x.date}</small></div><span class="green">+${fmt(x.v)}</span></div>`).join('')||'<div class="empty">Nenhuma movimentação.</div>'}</div>`}
function trophies(){return `<div class="content-title"><h2>🏆 Títulos e conquistas</h2><small>Seu legado</small></div><div class="grid g3"><div class="card"><div class="eyebrow">TÍTULOS</div><h2>${S.trophies.length}</h2><p class="muted">Trofeus conquistados</p></div><div class="card"><div class="eyebrow">GOLS</div><h2>${S.stats.goals}</h2><p class="muted">Na carreira</p></div><div class="card"><div class="eyebrow">MELHOR OVR</div><h2>${Math.max(...S.history.map(x=>x.ovr),S.player.ovr)}</h2><p class="muted">Pico registrado</p></div></div><div class="content-title"><h2>Conquistas</h2></div><div class="card">${S.trophies.length?S.trophies.map(t=>`<div class="row"><div><b>🏆 ${esc(t.name)}</b><small class="muted" style="display:block">${esc(t.club)} · ${t.year}</small></div><span>${esc(t.comp)}</span></div>`).join(''):'<div class="empty">Seu primeiro título ainda está esperando.</div>'}</div>`}
function national(){let p=S.player,eligible=p.ovr>=75&&p.form>=65&&p.popularity>=40;return `<div class="content-title"><h2>🇧🇷 Seleção</h2><small>Representar o país</small></div><div class="grid g3"><div class="card"><div class="eyebrow">STATUS</div><h2>${S.national.called?'CONVOCADO':'OBSERVADO'}</h2><p class="muted">${eligible?'Seu desempenho coloca seu nome no radar.':'Evolua OVR, forma e reputação.'}</p>${eligible&&!S.national.called?'<button class="btn primary" onclick="callNational()">Aceitar convocação</button>':''}</div><div class="card"><div class="eyebrow">JOGOS</div><h2>${S.national.apps}</h2><p class="muted">${S.national.goals} gols</p></div><div class="card"><div class="eyebrow">NÍVEL</div><h2>${S.national.level}</h2><p class="muted">A seleção é uma etapa especial da carreira.</p></div></div>`}
function callNational(){S.national.called=true;S.national.level='Seleção Principal';S.national.apps++;S.player.popularity=clamp(S.player.popularity+8,0,100);S.player.followers+=1200;S.news.unshift(`${S.player.name} foi convocado para a Seleção Brasileira.`);save();render();note('🇧🇷 Convocação aceita!')}
function ranking(){let p=S.player,rows=[['Rafael Santos',92],['João Victor',89],['V.GAERT',p.ovr],['Matheus Lima',84],['Pedro Henrique',81],['Lucas Costa',78]].sort((a,b)=>b[1]-a[1]);return `<div class="content-title"><h2>♛ Ranking</h2><small>Melhores jogadores do universo local</small></div><div class="card">${rows.map((r,i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-avatar">${i+1}</span><div class="rank-name"><b>${esc(r[0])}</b><small>Brasil · jogador</small></div><span class="ovr">${r[1]}</span></div>`).join('')}</div>`}
function settings(){return `<div class="content-title"><h2>⚙ Configurações</h2><small>Dados e progresso</small></div><div class="grid g2"><div class="card"><h3>Salvamento</h3><p class="muted">Seu progresso é salvo automaticamente neste navegador.</p><div class="actions"><button class="btn primary" onclick="exportSave()">Exportar carreira</button><button class="btn" onclick="document.getElementById('importFile').click()">Importar carreira</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importSave(this)"></div></div><div class="card"><h3>Avançar tempo</h3><p class="muted">Use com cuidado: dias avançam treinos, recuperação e calendário.</p><div class="actions"><button class="btn" onclick="advanceDays(1)">+1 dia</button><button class="btn" onclick="advanceDays(7)">+7 dias</button><button class="btn" onclick="advanceDays(30)">+30 dias</button></div></div><div class="card"><h3>Nova carreira</h3><p class="muted">Apaga o progresso local e volta para o criador.</p><button class="btn danger" onclick="resetCareer()">Começar do zero</button></div></div>`}
function advanceDays(n){for(let i=0;i<n;i++){addDays(1);S.player.energy=clamp(S.player.energy+6,0,100);S.player.fatigue=clamp(S.player.fatigue-5,0,100);if(S.player.injury&&Math.random()<.12)S.player.injury=null}save();render();note(`📅 ${n} dia(s) avançado(s).`)}
function resetCareer(){if(confirm('Começar uma nova carreira? O progresso atual será substituído neste navegador.')){S=repair(clone(base));S.id=Date.now();S.calendar=makeSeason();save();nav('create');note('Nova carreira criada.')}}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gaert-modo-carreiras-v7-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=repair(JSON.parse(r.result));save();nav('home');note('Save importado com sucesso!')}catch(e){alert('Arquivo de carreira inválido.')}};r.readAsText(f)}
function openModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q){S.news.unshift(`Busca no universo: “${q}”.`);save();note('🔎 Busca registrada no universo GAERT.')}}});
document.getElementById('charForm')?.addEventListener('submit',()=>{});
function bind(){let f=document.getElementById('charForm');if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f);let p=S.player;for(const [k,v] of fd.entries()){if(['shirt','height','weight'].includes(k))p[k]=Number(v);else p[k]=v}p.age=Math.max(12,Math.floor((Date.now()-new Date(p.birth).getTime())/31557600000));p.age=clamp(p.age,12,60);p.value=Math.max(10000,Math.round(p.value*(1+(p.ovr-67)*.012)));S.news.unshift(`${p.name} atualizou o perfil e começou um novo capítulo no ${p.club}.`);save();render();note('👤 Personagem salvo!')}}
function render(){let views={home,create:createPage,careers,calendar,squad,training,choices,matches,market,contracts,news,instagram,finance,trophies,national,ranking,settings};document.getElementById('appview').innerHTML=views[page]?views[page]():home();document.title=`${titles[page]||'GAERT'} — GAERT MODO CARREIRAS`;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('topName').textContent=S.player.name;document.getElementById('topClub').textContent=`${S.player.club} · ${S.player.level}`;bind();}
function tick(){let x=document.getElementById('clock');if(x)x.textContent=new Date().toLocaleTimeString('pt-BR',{hour12:false})}
if(S.match?.status==='live'){}save();render();setInterval(tick,1000);window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
</script>
</body></html>
