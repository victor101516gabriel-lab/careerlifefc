<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerLife FC — Modo Carreira</title>
<meta name="description" content="CareerLife FC: crie um jogador, viva temporadas, jogue partidas, negocie contratos e administre seu Instagram.">
<style>
:root{--bg:#07090d;--p:#0d1118;--p2:#111722;--line:#222c3a;--txt:#f5f7fa;--muted:#8995a7;--acc:#f2f4f7;--good:#58d68d;--bad:#ff6b6b;--gold:#f2c45e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b2636 0,#07090d 38%);color:var(--txt);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
aside{position:fixed;inset:0 auto 0 0;width:235px;background:#090c12;border-right:1px solid var(--line);padding:20px 13px;z-index:5}.brand{font-size:22px;font-weight:950;padding:5px 11px 22px}.brand i{font-style:normal;color:#8294aa}.nav-title{color:#59677a;font-size:10px;font-weight:900;letter-spacing:1px;padding:15px 11px 5px;text-transform:uppercase}.nav button{display:block;width:100%;border:0;background:none;color:#9aa6b7;padding:11px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:#161e2a;color:white}
main{margin-left:235px;padding:25px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:1.1px;color:#718097;font-weight:850;font-size:10px}.title{font-size:30px;font-weight:950;letter-spacing:-1px}.card{background:linear-gradient(145deg,#111720,#0b1017);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 14px 35px #0004}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:4px}.progress{height:7px;background:#202a36;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#edf0f4}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #1d2632}.row:last-child{border:0}.muted{color:var(--muted)}.green{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.btn{border:1px solid #2b3645;background:#151d28;color:#fff;border-radius:9px;padding:9px 13px;font-weight:800}.btn.primary{background:#f1f3f6;color:#070a0e;border-color:#f1f3f6}.btn:disabled{opacity:.45;cursor:not-allowed}.avatar{width:86px;height:86px;border-radius:18px;background:linear-gradient(145deg,#2a3545,#10151d);display:grid;place-items:center;font-size:27px;font-weight:950;border:1px solid #364354}.hero{display:flex;align-items:center;gap:16px}.pill{display:inline-block;border:1px solid #2a3543;border-radius:99px;padding:4px 8px;color:#aeb8c6;font-size:11px}.list{display:grid;gap:8px}.post{border:1px solid var(--line);background:#0a0f16;border-radius:13px;padding:14px}.posthead{display:flex;gap:9px;align-items:center}.mini{width:38px;height:38px;border-radius:11px;background:#1a2431;display:grid;place-items:center;font-weight:900}.postbody{padding:14px 0;font-size:15px}.metric{font-size:11px;color:#7c899b}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #202a36}th{color:#738197;font-size:10px;text-transform:uppercase}.tag{padding:4px 7px;border:1px solid #293444;border-radius:6px;font-size:10px}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{background:#0d131c;border:1px solid #2b3644;border-radius:16px;width:min(780px,100%);max-height:92vh;overflow:auto;padding:20px}.form{display:grid;gap:12px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#9ba7b7;font-weight:800}.field input,.field select,.field textarea{background:#080d13;color:white;border:1px solid #293544;border-radius:9px;padding:10px;outline:0}.field textarea{min-height:85px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.empty{text-align:center;padding:45px;color:#748195}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#f1f3f6;color:#070a0e;padding:11px 14px;border-radius:9px;font-weight:850;z-index:60}
@media(max-width:900px){aside{width:65px;padding:17px 7px}.brand{font-size:0;text-align:center}.brand:after{content:"CL";font-size:18px}.nav-title{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"●";font-size:17px}.nav button[data-action]{display:none}main{margin-left:65px;padding:16px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.title{font-size:25px}.fields{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.avatar{width:70px;height:70px}.hero{align-items:flex-start}}
</style></head>
<body>
<aside><div class="brand">Career<i>Life</i></div><div class="nav" id="nav">
<div class="nav-title">Carreira</div><button data-page="home">Início</button><button data-page="player">Meu Jogador</button><button data-page="career">Carreira</button><button data-page="matches">Partidas</button><button data-page="market">Mercado</button>
<div class="nav-title">Universo</div><button data-page="instagram">Instagram</button><button data-page="news">Notícias</button><button data-page="finance">Finanças</button><button data-page="trophies">Títulos</button><button data-page="national">Seleção</button>
<div class="nav-title">Save</div><button data-action="new">Nova carreira</button><button data-action="export">Exportar</button><button data-action="import">Importar</button><input hidden id="import" type="file" accept=".json">
</div></aside>
<main><div class="top"><div><div class="eyebrow">Football Career Simulator</div><div class="title" id="title">Início</div></div><button class="btn primary" onclick="advanceDay()">Avançar dia</button></div><div id="app"></div></main>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const KEY="careerLife_complete_v1";
const base={player:{name:"V.GAERT",shirt:"14",age:16,birth:"2010-02-10",nation:"Brasil",city:"Porto Alegre",position:"Meia",secondary:"PD",foot:"Direito",height:178,weight:68,club:"Vasco",level:"Base",ovr:67,potential:89,value:350000,salary:1800,contract:2,popularity:35,followers:1240,pro:78,amb:86,lead:58,hum:72,temp:64,loyal:80,pace:78,dribble:81,pass:76,finish:70,strength:61,stamina:74,vision:79,defense:35,control:83},
date:{d:15,m:9,y:2026},stats:{apps:0,goals:0,assists:0,minutes:0,yellow:0,red:0},season:{apps:0,goals:0,assists:0},injury:null,posts:[{text:"Começando uma nova fase. Trabalho, foco e gratidão. ⚽",likes:186,comments:12,date:"15/09/2026"}],news:["V.GAERT é apontado como uma das promessas para observar na base.","Comissão técnica destaca evolução do meia nos treinamentos."],offers:[],trophies:[],finance:[],history:[{year:2026,age:16,club:"Vasco",apps:0,goals:0,assists:0,ovr:67}],national:{apps:0,goals:0,called:false}};
let S=load(),page="home";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch{return structuredClone(base)}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function fmt(n){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(n)}
function note(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1700)}
function nav(p){page=p;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.getElementById("title").textContent={home:"Início",player:"Meu Jogador",career:"Carreira",matches:"Partidas",market:"Mercado",instagram:"Instagram",news:"Notícias",finance:"Finanças",trophies:"Títulos",national:"Seleção"}[p];render()}
document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>nav(x.dataset.page));
function stats(){let p=S.player;return `<div class="grid g4"><div class="card stat"><span>OVERALL</span><b>${p.ovr}</b><div class="progress"><i style="width:${p.ovr}%"></i></div></div><div class="card stat"><span>POTENCIAL</span><b>${p.potential}</b><div class="progress"><i style="width:${p.potential}%"></i></div></div><div class="card stat"><span>SEGUIDORES</span><b>${p.followers.toLocaleString("pt-BR")}</b><span>Instagram</span></div><div class="card stat"><span>VALOR DE MERCADO</span><b>${fmt(p.value)}</b></div></div>`}
function home(){let p=S.player;return stats()+`<div class="grid g2" style="margin-top:15px"><div class="card"><div class="hero"><div class="avatar">${p.shirt}</div><div><div class="eyebrow">${p.club} · ${p.level}</div><h2 style="margin:2px 0">${p.name}</h2><span class="muted">${p.position} · ${p.foot} · ${p.age} anos</span><div style="margin-top:9px"><span class="pill">Camisa ${p.shirt}</span> <span class="pill">Contrato ${p.contract} anos</span></div></div></div><div class="list" style="margin-top:15px"><div class="row"><span>Temporada</span><b>${S.date.y}</b></div><div class="row"><span>Jogos na carreira</span><b>${S.stats.apps}</b></div><div class="row"><span>Gols / Assistências</span><b>${S.stats.goals} / ${S.stats.assists}</b></div><div class="row"><span>Lesão</span><b>${p.injury||"Nenhuma"}</b></div></div></div><div class="card"><div class="eyebrow">Última publicação</div>${S.posts[0]?post(S.posts[0]):""}</div></div><div class="grid g2" style="margin-top:15px"><div class="card"><div class="eyebrow">Notícias</div>${S.news.slice(0,5).map(n=>`<div class="row"><span>${n}</span></div>`).join("")}</div><div class="card"><div class="eyebrow">Próximo passo</div><h2>Vasco x Flamengo</h2><p class="muted">Partida da temporada. Seu desempenho altera atributos, reputação e mercado.</p><button class="btn primary" onclick="nav('matches')">Ir para partida</button></div></div>`}
function post(o){return `<div class="post" style="margin-top:10px"><div class="posthead"><div class="mini">${S.player.shirt}</div><b>${S.player.name}</b><span class="muted">· ${o.date}</span></div><div class="postbody">${o.text}</div><span class="metric">♥ ${o.likes} · ${o.comments} comentários</span></div>`}
function player(){let p=S.player, a=[["Velocidade","pace"],["Drible","dribble"],["Passe","pass"],["Finalização","finish"],["Força","strength"],["Resistência","stamina"],["Visão","vision"],["Defesa","defense"],["Controle","control"]];return `<div class="card"><div class="hero"><div class="avatar">${p.shirt}</div><div><div class="eyebrow">${p.nation} · ${p.city}</div><h2 style="margin:2px 0">${p.name}</h2><span class="muted">${p.position} · ${p.secondary} · Pé ${p.foot}</span></div><button class="btn primary" style="margin-left:auto" onclick="editPlayer()">Editar</button></div></div><div class="grid g2" style="margin-top:15px"><div class="card"><h3>Dados</h3>${[["Idade",p.age],["Nascimento",p.birth],["Altura",p.height+" cm"],["Peso",p.weight+" kg"],["Clube",p.club],["Status",p.level],["Salário",fmt(p.salary)],["Valor",fmt(p.value)]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card"><h3>Atributos</h3>${a.map(x=>`<div style="margin:10px 0"><div class="row" style="padding:0;border:0"><span>${x[0]}</span><b>${p[x[1]]}</b></div><div class="progress"><i style="width:${p[x[1]]}%"></i></div></div>`).join("")}</div></div>`}
function career(){return `<div class="card"><div class="eyebrow">Histórico</div><h2>Uma carreira inteira</h2>${S.history.slice().reverse().map(h=>`<div class="row"><span><b>${h.year}</b> · ${h.age} anos · ${h.club}</span><span>${h.apps} jogos · ${h.goals} gols · ${h.assists} assist. · OVR ${h.ovr}</span></div>`).join("")}</div><div class="grid g3" style="margin-top:15px"><div class="card stat"><span>JOGOS</span><b>${S.stats.apps}</b></div><div class="card stat"><span>GOLS</span><b>${S.stats.goals}</b></div><div class="card stat"><span>ASSISTÊNCIAS</span><b>${S.stats.assists}</b></div></div>`}
function matches(){let p=S.player;return `<div class="grid g2"><div class="card"><div class="eyebrow">Próxima partida</div><h2>Vasco x Flamengo</h2><p class="muted">Campeonato Brasileiro · Base · São Januário</p><div class="row"><span>Status</span><b>${p.ovr>=72?"Titular":"Banco"}</b></div><button class="btn primary" onclick="play(false)">JOGAR</button> <button class="btn" onclick="play(true)">SIMULAR</button></div><div class="card"><div class="eyebrow">Temporada ${S.date.y}</div>${[["Jogos",S.season.apps],["Gols",S.season.goals],["Assistências",S.season.assists],["Amarelos",S.stats.yellow],["Vermelhos",S.stats.red]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div></div>`}
function market(){let p=S.player, clubs=[["Braga","€650 mil","Rotação","68%"],["Athletico-PR","R$ 900 mil","Titular","54%"],["Benfica","€1,2 mi","Reserva","31%"],["Grêmio","R$ 1,1 mi","Titular","47%"]];return `<div class="card"><div class="eyebrow">Mercado da bola</div><h2>Interesses</h2>${clubs.map(c=>`<div class="row"><span><b>${c[0]}</b><br><small class="muted">${c[2]} · ${c[3]}</small></span><span>${c[1]} <button class="btn" onclick="offer('${c[0]}')">Proposta</button></span></div>`).join("")}</div><div class="card" style="margin-top:15px"><h3>Seu contrato</h3><div class="row"><span>Clube</span><b>${p.club}</b></div><div class="row"><span>Salário</span><b>${fmt(p.salary)}/mês</b></div><div class="row"><span>Fim</span><b>${S.date.y+p.contract}</b></div></div>`}
function instagram(){let p=S.player, user=p.name.toLowerCase().replace(/[^a-z0-9]/g,"");return `<div class="grid g2"><div class="card"><div class="hero"><div class="avatar">${p.shirt}</div><div><h2 style="margin:0">@${user}</h2><span class="muted">${p.followers.toLocaleString("pt-BR")} seguidores</span><p>⚽ ${p.position} · ${p.club}<br>Vivendo o sonho, um dia de cada vez.</p></div></div><button class="btn primary" onclick="newPost()">+ Publicação</button></div><div class="card"><div class="eyebrow">Imagem pública</div><div class="stat"><span>POPULARIDADE</span><b>${p.popularity}/100</b><div class="progress"><i style="width:${p.popularity}%"></i></div></div></div></div><div style="max-width:700px;margin:15px auto" class="list">${S.posts.map(post).join("")}</div>`}
function news(){return `<div class="list">${S.news.map(n=>`<div class="card"><b>📰 ${n}</b><div class="muted" style="margin-top:4px">CareerLife News · ${S.date.d}/${S.date.m}/${S.date.y}</div></div>`).join("")}</div>`}
function finance(){let total=S.finance.reduce((a,b)=>a+b.v,0);return `<div class="grid g3"><div class="card stat"><span>SALDO REGISTRADO</span><b class="${total>=0?"green":"bad"}">${fmt(total)}</b></div><div class="card stat"><span>SALÁRIO</span><b>${fmt(S.player.salary)}</b></div><div class="card stat"><span>VALOR DE MERCADO</span><b>${fmt(S.player.value)}</b></div></div><div class="card" style="margin-top:15px"><h3>Extrato</h3><table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${S.finance.slice().reverse().map(f=>`<tr><td>${f.date}</td><td>${f.type}</td><td class="${f.v>=0?"green":"bad"}">${fmt(f.v)}</td></tr>`).join("")}</tbody></table></div>`}
function trophies(){return `<div class="card"><div class="eyebrow">Hall da fama</div><h2>Títulos e prêmios</h2>${S.trophies.length?S.trophies.map(t=>`<div class="row"><span>🏆 ${t}</span><span class="gold">CONQUISTADO</span></div>`).join(""):`<div class="empty">Nenhum título ainda.<br>Sua história começa agora.</div>`}</div>`}
function national(){return `<div class="grid g2"><div class="card"><div class="eyebrow">Seleção</div><h2>Brasil</h2><div class="row"><span>Status</span><b>${S.national.called?"Convocado":"Fora da convocação"}</b></div><div class="row"><span>Jogos</span><b>${S.national.apps}</b></div><div class="row"><span>Gols</span><b>${S.national.goals}</b></div><button class="btn" onclick="nationalEvent()">Simular ciclo de seleção</button></div><div class="card"><div class="eyebrow">Competições</div><div class="row"><span>Eliminatórias</span><span class="tag">Disponível</span></div><div class="row"><span>Copa América</span><span class="tag">Disponível</span></div><div class="row"><span>Copa do Mundo</span><span class="tag">Disponível</span></div></div></div>`}
function render(){document.getElementById("app").innerHTML={home,player,career,matches,market,instagram,news,finance,trophies,national}[page]()}
function openModal(x){document.getElementById("modalbox").innerHTML=x;document.getElementById("modal").classList.add("open")}function closeModal(){document.getElementById("modal").classList.remove("open")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
function editPlayer(){let p=S.player;let fields=[["name","Nome de camisa","text"],["shirt","Número","number"],["age","Idade","number"],["nation","Nacionalidade","text"],["city","Cidade","text"],["position","Posição","text"],["secondary","Posição secundária","text"],["foot","Pé dominante","text"],["club","Clube","text"],["height","Altura","number"],["weight","Peso","number"],["salary","Salário","number"]];openModal(`<h2>Editar jogador</h2><form class="form" id="edit"><div class="fields">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" type="${f[2]}" value="${p[f[0]]}"></div>`).join("")}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);document.getElementById("edit").onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);for(let [k,v] of fd)p[k]=["shirt","age","height","weight","salary"].includes(k)?Number(v):v;save();closeModal();render();note("Jogador atualizado")}}
function newPost(){openModal(`<h2>Nova publicação</h2><form class="form" id="post"><div class="field"><label>Texto</label><textarea name="text" required placeholder="Escreva sua publicação..."></textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Publicar</button></div></form>`);document.getElementById("post").onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get("text"),l=Math.floor(40+S.player.followers*.04+Math.random()*400);S.posts.unshift({text:t,likes:l,comments:Math.floor(l*.04),date:dateStr()});S.player.followers+=Math.floor(l*.08);S.player.popularity=Math.min(100,S.player.popularity+2);S.news.unshift(`${S.player.name} publica nas redes e movimenta a torcida.`);save();closeModal();render();note("Publicado no Instagram")}}
function dateStr(){return `${String(S.date.d).padStart(2,"0")}/${String(S.date.m).padStart(2,"0")}/${S.date.y}`}
function play(sim){if(S.player.injury){note("Você está lesionado.");return}let p=S.player;let rating=p.ovr/10+(Math.random()*3-1);let g=Math.random()<(p.finish/100*.35),a=Math.random()<(p.pass/100*.25);S.stats.apps++;S.season.apps++;S.stats.minutes+=Math.floor(35+Math.random()*60);if(g){S.stats.goals++;S.season.goals++}if(a){S.stats.assists++;S.season.assists++}if(Math.random()<.06){S.stats.yellow++}if(Math.random()<.008){S.stats.red++}if(Math.random()<.018){p.injury="lesão muscular — 14 dias"}if(rating>8&&p.ovr<p.potential)p.ovr++;p.popularity=Math.min(100,p.popularity+(g?4:1));p.followers+=g?Math.floor(350+Math.random()*800):Math.floor(40+Math.random()*180);S.finance.push({date:dateStr(),type:"Bônus de partida",v:g?650:250});S.news.unshift(g?`${p.name} marca em Vasco x Flamengo e vira destaque.`:`${p.name} participa da partida e segue em evolução.`);save();render();note(g?"⚽ GOL!":"Partida concluída")}
function offer(c){S.offers.push({club:c,date:dateStr(),status:"Em análise"});S.news.unshift(`${c} demonstrou interesse em ${S.player.name}.`);save();render();note("Interesse registrado")}
function nationalEvent(){let p=S.player;if(p.ovr>=76||Math.random()<.25){S.national.called=true;S.national.apps++;if(Math.random()<.2)S.national.goals++;S.news.unshift(`${p.name} foi convocado para a Seleção Brasileira.`);p.popularity=Math.min(100,p.popularity+6);p.followers+=700}else{S.news.unshift(`${p.name} ainda não aparece na lista da Seleção.`)}save();render();note(S.national.called?"🇧🇷 Convocado!":"Ainda não convocado")}
function advanceDay(){S.date.d++;if(S.date.d>30){S.date.d=1;S.date.m++;if(S.date.m>12){S.date.m=1;S.date.y++;S.player.age++;S.history.push({year:S.date.y,age:S.player.age,club:S.player.club,apps:S.season.apps,goals:S.season.goals,assists:S.season.assists,ovr:S.player.ovr});S.season={apps:0,goals:0,assists:0};if(S.player.age>=30&&S.player.ovr>55)S.player.ovr--;if(S.player.age>=38&&S.player.ovr>45)S.player.ovr-=2;S.news.unshift(`Nova temporada: ${S.date.y}. ${S.player.name} agora tem ${S.player.age} anos.`)}}if(S.player.injury){if(Math.random()<.12)S.player.injury=null}if(Math.random()<.08&&S.player.ovr<S.player.potential)S.player.ovr++;S.finance.push({date:dateStr(),type:"Salário diário",v:Math.round(S.player.salary/30)});save();render();note("Dia avançado")}
function newCareer(){if(confirm("Apagar o save atual e começar uma nova carreira?")){S=structuredClone(base);save();nav("home");note("Nova carreira criada")}}
document.querySelector('[data-action="new"]').onclick=newCareer;
document.querySelector('[data-action="export"]').onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="careerlifefc-save.json";a.click();URL.revokeObjectURL(a.href)};
document.querySelector('[data-action="import"]').onclick=()=>document.getElementById("import").click();

nav("home");
